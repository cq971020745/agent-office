# 在 macOS Runner 上打木牛流马 Mac 安装包（Windows 本机无法可靠交叉编译）
# 触发：Actions → Pack macOS → Run workflow
# 未配置 Apple 开发者证书时使用 ad-hoc 签名；用户仍可能需 xattr -cr 去掉隔离属性。
name: Pack macOS

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "架构（arm64=Apple Silicon，x64=Intel，universal=两者各打一份）"
        type: choice
        options:
          - arm64
          - x64
          - universal
        default: arm64
      release_tag:
        description: "可选：发布到该 GitHub Release tag（如 v0.1.0）；留空只上传 Artifact"
        required: false
        default: ""

concurrency:
  group: pack-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage server + build + pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          ARCH="${{ inputs.arch }}"
          node scripts/stage-server.mjs
          pnpm --filter @office/desktop build
          cd apps/desktop
          # identity=- ：ad-hoc 签名（勿用 null，否则易报「已损坏」）
          case "$ARCH" in
            arm64)
              pnpm exec electron-builder --mac --arm64 -c.mac.identity=-
              ;;
            x64)
              pnpm exec electron-builder --mac --x64 -c.mac.identity=-
              ;;
            universal)
              pnpm exec electron-builder --mac --x64 --arm64 -c.mac.identity=-
              ;;
          esac
          echo "=== release ==="
          ls -lah release || true

      - name: Upload mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muniu-liuma-mac-${{ inputs.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Rename DMG to ASCII for GitHub Release
        if: ${{ inputs.release_tag != '' }}
        working-directory: apps/desktop/release
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in *.dmg; do
            case "$f" in
              *-mac-arm64.dmg) mv -f "$f" "Muni-${{ inputs.release_tag#v }}-mac-arm64.dmg" ;;
              *-mac-x64.dmg)   mv -f "$f" "Muni-${{ inputs.release_tag#v }}-mac-x64.dmg" ;;
              *) echo "skip $f" ;;
            esac
          done
          ls -lah

      - name: Publish to GitHub Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: 木牛流马 ${{ inputs.release_tag }}
          draft: false
          prerelease: false
          files: |
            apps/desktop/release/Muni-*.dmg
          fail_on_unmatched_files: true
          body: |
            木牛流马桌面客户端（Mac）。

            - 官网下载（推荐）：http://139.196.147.134/muniu-liuma/
            - 未使用 Apple 开发者证书签名。若提示「已损坏」，在终端执行：
              `xattr -cr /Applications/木牛流马.app`
            - 请勿用微信转发安装包。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
