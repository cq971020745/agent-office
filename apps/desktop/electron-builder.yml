appId: com.agentoffice.app
productName: 木牛流马
copyright: Copyright © 木牛流马
directories:
  output: release
  buildResources: build
afterPack: scripts/after-pack.cjs
files:
  - out/**/*
asar: true
asarUnpack:
  - "**/*.node"
extraResources:
  - from: ../../dist/stage/server
    to: server
  - from: ../../dist/stage/node
    to: node
  - from: ../../dist/stage/pi-packages
    to: pi-packages
  - from: ../../dist/stage/skills-catalog
    to: skills-catalog
  - from: ../../dist/stage/agent-packs
    to: agent-packs
  - from: ../../dist/stage/skin-packs
    to: skin-packs
  - from: ../../dist/stage/python
    to: python
# 无证书时 signing 自动跳过，一体包不做代码签名
forceCodeSigning: false
# maximum 会把安装包压得很小，但解压上万小文件时安装极慢；normal 略增体积、安装快很多
compression: normal
win:
  # 必须保持 false：置 true 会进入签名管理器并下载 winCodeSign，其中 darwin 符号链接
  # 在未开开发者模式的 Windows（本机与 CI）上解压失败。exe 的图标/版本信息由
  # after-pack.cjs 用 rcedit npm 包补写（独立二进制，不依赖 winCodeSign）。
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 木牛流马
  artifactName: ${productName}-${version}-win-${arch}-Setup.${ext}
  # 安装阶段少做校验，缩短卡在「正在安装」的时间
  differentialPackage: false
portable:
  artifactName: ${productName}-${version}-win-${arch}-Portable.${ext}
mac:
  # "-" = ad-hoc 签名（无需 Apple 开发者账号）。勿用 null：无签名时部分 macOS 会直接报「已损坏」。
  # 用户从网上下载后仍可能需：xattr -cr /Applications/木牛流马.app
  identity: "-"
  gatekeeperAssess: false
  hardenedRuntime: false
  target:
    - target: dmg
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Office
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
